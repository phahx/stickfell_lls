[package]
name = "stickfell_character_lab"
description = "Tries new character art on Stickfell's real fighters, separate from the game"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "character_lab"
path = "src/main.rs"
# it borrows the game's source files, whose tests live in the game crate
test = false

[dependencies]
glam.workspace = true
png.workspace = true
stickfell_physics.workspace = true
stickfell_net.workspace = true
stickfell_render.workspace = true
stickfell_app.workspace = true
rodio = { version = "0.23.0", default-features = false, features = ["playback", "vorbis", "wav"] }
# (rodio's audio backend, named here to turn on "realtime": the audio thread
# gets real-time priority, so a busy frame never starves it into dropouts)
cpal = { version = "0.18.2", features = ["realtime"] }
serde_json = "1"
